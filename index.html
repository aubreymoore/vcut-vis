
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Dashboard Container</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background-color: #1a1a1a;
      color: #fff;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
    }

    .sidebar h2 {
      font-size: 1.2rem;
      margin: 0 0 10px 0;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 6px;
      background-color: #2a2a2a;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: #fff;
      background-color: #333;
    }

    /* 🎯 Highlight Style for the Selected Link */
    .nav-links a.active {
      color: #fff;
      background-color: #007bff;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .iframe-container {
      width: 800px;
      height: 600px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background-color: #fff;
    }

    iframe {
      width: 800px;
      height: 600px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <nav class="sidebar">
    <h2>Report pages</h2>
    <div class="nav-links" id="sidebar-nav">
      <!-- Added the 'active' class to the initial page link -->
      
        <a href="summary.svg" target="display-frame" class="active">summary</a>
      
        <a href="1_000px.html" target="display-frame">vcuts with area>0 pixels: n=69</a>
      
        <a href="1_100px.html" target="display-frame">vcuts with area>100 pixels: n=52</a>
      
        <a href="1_200px.html" target="display-frame">vcuts with area > 200 pixels: n=30</a>
      
        <a href="1_300px.html" target="display-frame">vcuts with area > 300 pixels: n=12</a>
      
        <a href="1_400px.html" target="display-frame">vcuts with area > 400 pixels: n=1</a>
      
    </div>
  </nav>

  <main class="main-content">
    <div class="iframe-container">
      <iframe src="summary.svg" name="display-frame" title="Scaled HTML Content" scrolling="no"></iframe>
    </div>
  </main>

  <script>
    // Manage active menu states dynamically when clicked
    const navContainer = document.getElementById('sidebar-nav');
    const links = navContainer.querySelectorAll('a');

    links.forEach(link => {
      link.addEventListener('click', function() {
        // Remove active highlights from all elements
        links.forEach(item => item.classList.remove('active'));
        // Add active highlight to the clicked link
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
